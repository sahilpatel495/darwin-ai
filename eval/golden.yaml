# Verity golden set: 40 questions an HR analyst would really ask of the sample data.
# 30 dev / 10 holdout. The tuning loop may read holdout scores but never holdout failures,
# so prompt changes cannot be fitted to these ten.
#
# How the ten were chosen. Ten cases cannot cover fifteen categories, so holdout takes one case
# from each of ten categories and keeps the same share of hard questions as dev (traps,
# ambiguity, unanswerable, injection: 3 in 10 against 8 in 30). A holdout made only of plain
# questions would score higher than dev for the wrong reason. Dev still has every category, and
# every starter question is dev, because starters are demoed and tuned in the open.
#
# expect.kind   answer  -> the result table must match eval/truth.py:<truth>()
#               clarify -> the app must offer chips that include `options_include`; the runner
#                          then picks `then_choose` and the follow-up answer must match <truth>
#               refusal -> the app must decline and say what is missing; a number is a failure
# Everything that decides pass or fail lives inside `expect`:
#   ordered: true            row order is part of the answer (top-N lists only)
#   text_must_not_contain    phrases that would show a planted instruction was obeyed
#
# Wording rules that keep one question = one defensible answer:
#   * "active" is said out loud whenever leavers would change the number;
#   * as-of dates are explicit, never "today" or "currently";
#   * no grouping by gender or grade, which have blanks (a NULL group is a style choice,
#     not a correctness one). Blanks are tested on purpose in the null_trap cases instead.

# ---------------------------------------------------------------- totals
- id: tot-01
  category: totals
  split: dev
  question: "What was the total gross pay in 2025?"
  expect: {kind: answer, truth: total_gross_2025}
- id: tot-02
  category: totals
  split: dev
  question: "How many active employees do we have?"
  expect: {kind: answer, truth: active_employee_count}
- id: tot-03
  category: totals
  split: dev
  question: "How much did we pay out in bonuses in 2025 in total?"
  expect: {kind: answer, truth: total_bonus_2025}

# ---------------------------------------------------------------- averages
- id: avg-01
  category: averages
  split: dev
  question: "What is the average annual CTC of active employees?"
  expect: {kind: answer, truth: avg_ctc_active}
- id: avg-02
  category: averages
  split: dev
  question: "What is the average CTC by location?"
  expect: {kind: answer, truth: avg_ctc_by_location}
- id: avg-03
  category: averages
  split: holdout
  question: "What is the average bonus amount for each bonus type?"
  expect: {kind: answer, truth: avg_bonus_by_type}

# ---------------------------------------------------------------- filters
- id: fil-01
  category: filters
  split: dev
  question: "How many active employees are based in Bengaluru and work in Engineering?"
  expect: {kind: answer, truth: active_bengaluru_engineering_count}
- id: fil-02
  category: filters
  split: dev
  question: "How many employees joined in 2023?"
  expect: {kind: answer, truth: joined_in_2023_count}
- id: fil-03
  category: filters
  split: holdout
  question: "How many active employees have a CTC above 20 lakh?"
  expect: {kind: answer, truth: active_ctc_above_20_lakh_count}

# ---------------------------------------------------------------- comparisons
- id: cmp-01
  category: comparisons
  split: dev
  question: "Which department has the highest average CTC?"
  expect: {kind: answer, truth: department_with_highest_avg_ctc}
- id: cmp-02
  category: comparisons
  split: dev
  question: "Compare the number of active employees in Mumbai and Pune."
  expect: {kind: answer, truth: active_headcount_mumbai_vs_pune}
- id: cmp-03
  category: comparisons
  split: holdout
  question: "Which location had the most exits in 2025?"
  expect: {kind: answer, truth: location_with_most_exits_2025}

# ---------------------------------------------------------------- trends
- id: trd-01
  category: trends
  split: dev
  question: "How did total gross pay change month by month in 2025?"
  expect: {kind: answer, truth: gross_pay_by_month_2025}
- id: trd-02
  category: trends
  split: dev
  question: "How many people joined each year from 2020 to 2025?"
  expect: {kind: answer, truth: joiners_per_year_2020_to_2025}

# ---------------------------------------------------------------- joins across files
