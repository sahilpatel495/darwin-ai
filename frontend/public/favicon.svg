<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- DarwinLens in one mark: a lens over one data point. Ink ground like the app's black pills,
       and the single cobalt accent (§2) is the point being looked at. Bold shapes only, so it
       still reads at 16px in a browser tab. -->
  <circle cx="16" cy="16" r="16" fill="#0A1317"/>
  <circle cx="14" cy="14" r="6.6" fill="none" stroke="#fff" stroke-width="2.8"/>
  <path d="M19.2 19.2l5.2 5.2" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="14" cy="14" r="2.5" fill="#3B8BFF"/>
</svg>
