# Render Blueprint: New > Blueprint > pick this repository. Render builds the Dockerfile, sets
# $PORT, and asks for the secret values below in its dashboard. No secret is stored in git.
services:
  - type: web
    name: verity
    runtime: docker
    plan: free # 512 MB, 0.1 CPU, sleeps after 15 idle minutes; .github/workflows/keepwarm.yml pings it
    region: singapore # closest free region to users in India; it cannot be changed later
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Add at least one key. Providers without a key are skipped by the failover chain.
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Sized for the 512 MB instance. Locally the defaults are 25 MB, 512MB and 20 sessions.
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: DUCKDB_MEMORY_LIMIT
        value: 256MB
      - key: MAX_SESSIONS
        value: "8"
      # To pin the model the golden eval chose, add for example:
      # - key: LLM_SQL_CHAIN
      #   value: groq:openai/gpt-oss-120b,nvidia:deepseek-ai/deepseek-v4-flash-0731
