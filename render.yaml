# Render Blueprint: New > Blueprint > pick this repository. Render builds the Dockerfile, sets
# $PORT, and asks for the secret values below in its dashboard. No secret is stored in git.
services:
  - type: web
    name: darwinlens
    runtime: docker
    plan: free # 512 MB, 0.1 CPU, sleeps after 15 idle minutes; .github/workflows/keepwarm.yml pings it
    region: singapore # closest free region to users in India; it cannot be changed later
    healthCheckPath: /healthz
    autoDeployTrigger: commit # redeploy on every push; replaces Render's deprecated `autoDeploy`
    envVars:
      # sync: false = Render asks for the value once, when the Blueprint is created. One key is
      # enough: a provider whose key is missing or empty is skipped by the failover chain.
      # Add or change keys later under the service's Environment tab.
      - key: GROQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Signs the sign-in tokens. generateValue: true = Render invents a long random value once
      # and keeps it across deploys, so people stay signed in; nobody, including us, types it.
      - key: AUTH_SECRET
        generateValue: true
      # Sized for the 512 MB instance. Locally the defaults are 25 MB, 512MB and 20 sessions.
      - key: MAX_UPLOAD_MB
        value: "10"
      - key: DUCKDB_MEMORY_LIMIT
        value: 256MB
      # Already the default; stated so the hosted sizing is all in one place (0.1 CPU).
      - key: DUCKDB_THREADS
        value: "2"
      - key: MAX_SESSIONS
        value: "12"
      # One address cannot push everyone else out: 5 new sessions an hour against 12 slots.
      - key: SESSIONS_PER_IP_PER_HOUR
        value: "5"
      # To pin the model the golden eval chose, add for example:
      # - key: LLM_SQL_CHAIN
      #   value: groq:openai/gpt-oss-120b,nvidia:deepseek-ai/deepseek-v4-flash-0731
